# 将以下内容粘贴到宝塔：网站 → 设置 → 配置文件中的 server { } 内部。

index index.html;
error_page 404 /404.html;

# 陪玩视频最大40MB，留出表单请求开销；已有同名指令时修改原值。
client_max_body_size 50m;

# 报名二维码后台：私有数据不可直接下载；PHP仍由宝塔的PHP配置处理。
location ^~ /api/_join-private/ {
    deny all;
}

# 本地工作记录和压缩包不作为网站内容发布。
location ^~ /_本地工作记录/ {
    deny all;
}

# 不对外提供隐藏文件和目录（保留证书验证目录）。
location ~ (^|/)\.(?!well-known(?:/|$)) {
    deny all;
}
# 备份、源码归档和内部部署文档不属于公开资源。
location ~* \.(?:zip|7z|rar|tar|gz|bak|old|sql|log|ini|conf|env|md|docx?|xlsx?|pptx?)$ {
    deny all;
}

location / {
    try_files $uri $uri/ =404;
}

# HTML 和账号脚本不做长缓存，更新后立即生效。
location ~* \.(?:html)$ {
    expires -1;
}

# CSS/JS 保持短缓存，便于上线后快速修复。
location ~* \.(?:css|js)$ {
    expires 1h;
    access_log off;
}

# 图片、字体和音视频使用较长缓存。
location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?|mp3|m4a|wav|mp4|webm)$ {
    expires 7d;
    access_log off;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=()" always;
